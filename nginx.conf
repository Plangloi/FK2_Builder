server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects relative so they survive the host port mapping (8000 -> 80).
    absolute_redirect off;

    # The runtime derives its root from the page URL, so redirect rather than alias.
    location = / {
        return 302 /UCP%20Panel%20Builder.dc.html;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
}
